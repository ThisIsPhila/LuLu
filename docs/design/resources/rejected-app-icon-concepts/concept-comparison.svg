<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 760" role="img" aria-labelledby="title">
  <title id="title">LuLu app icon concept exploration</title>
  <rect width="1740" height="760" fill="#F7F2E9"/>
  <text x="72" y="78" fill="#242421" font-family="Arial, sans-serif" font-size="20" letter-spacing="6">LULU / APP ICON CONCEPTS</text>
  <text x="72" y="116" fill="#6E6A62" font-family="Arial, sans-serif" font-size="16" letter-spacing="1.3">Symbol directions for the square canvas — no wordmark or background-only variants</text>
  <image href="concept-01-folded-page.png" x="72" y="158" width="340" height="340"/>
  <image href="concept-02-open-journal.png" x="492" y="158" width="340" height="340"/>
  <image href="concept-03-layered-stories.png" x="912" y="158" width="340" height="340"/>
  <image href="concept-04-unfolding-line.png" x="1332" y="158" width="340" height="340"/>
  <text x="72" y="548" fill="#242421" font-family="Arial, sans-serif" font-size="19" letter-spacing="2">01  FOLDED PAGE</text>
  <text x="72" y="580" fill="#6E6A62" font-family="Arial, sans-serif" font-size="15">A single page, gently held</text>
  <text x="492" y="548" fill="#242421" font-family="Arial, sans-serif" font-size="19" letter-spacing="2">02  OPEN JOURNAL</text>
  <text x="492" y="580" fill="#6E6A62" font-family="Arial, sans-serif" font-size="15">A familiar, welcoming book form</text>
  <text x="912" y="548" fill="#242421" font-family="Arial, sans-serif" font-size="19" letter-spacing="2">03  LAYERED STORIES</text>
  <text x="912" y="580" fill="#6E6A62" font-family="Arial, sans-serif" font-size="15">Many moments, held together</text>
  <text x="1332" y="548" fill="#242421" font-family="Arial, sans-serif" font-size="19" letter-spacing="2">04  UNFOLDING LINE</text>
  <text x="1332" y="580" fill="#6E6A62" font-family="Arial, sans-serif" font-size="15">A story opening into a leaf</text>
  <text x="72" y="700" fill="#817B71" font-family="Arial, sans-serif" font-size="13" letter-spacing="1.4">CONCEPT EXPLORATION  ·  1024 × 1024 ICON CANVAS  ·  NOT YET SELECTED</text>
</svg>
