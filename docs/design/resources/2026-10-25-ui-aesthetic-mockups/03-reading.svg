  <rect x="306" y="53" width="100" height="34" rx="17" fill="#eeece4" stroke="#dbd9d0"/><path d="M322 66 329 63l7 3v4c0 4-3 6-7 7-4-1-7-3-7-7z" fill="none" stroke="#666b5c" stroke-width="1.1"/><text x="368" y="74" text-anchor="middle" font-family="Menlo,monospace" font-size="8.5" letter-spacing=".6" fill="#5b5e51">PRIVATE</text>
  <text x="31" y="145" font-family="Menlo,monospace" font-size="9" letter-spacing="1.3" fill="#77736a">A STORY FROM THE JOURNAL</text>
  <path d="M31 159h23" stroke="#9ca38f" stroke-width="1.2"/>
  <text x="30" y="213" font-family="Georgia,serif" font-size="38" letter-spacing="-1.7" fill="#1a1a18">The shape</text>
  <text x="30" y="254" font-family="Georgia,serif" font-size="38" letter-spacing="-1.7" fill="#1a1a18">of a morning</text>
  <text x="31" y="287" font-family="Georgia,serif" font-size="14" font-style="italic" fill="#777268">A small note about taking the long way home.</text>
  <line x1="31" y1="315" x2="70" y2="315" stroke="#9da28f" stroke-width="1.2"/>
  <text x="31" y="359" font-family="Georgia,serif" font-size="18" fill="#34332f">The city was still easing into itself.</text>
  <text x="31" y="390" font-family="Georgia,serif" font-size="18" fill="#34332f">A few shutters were open, and someone</text>
  <text x="31" y="421" font-family="Georgia,serif" font-size="18" fill="#34332f">was carrying a crate of oranges into</text>
  <text x="31" y="452" font-family="Georgia,serif" font-size="18" fill="#34332f">the market.</text>
  <text x="31" y="504" font-family="Georgia,serif" font-size="18" fill="#34332f">She took the quiet street instead of</text>
  <text x="31" y="535" font-family="Georgia,serif" font-size="18" fill="#34332f">the familiar one. There was no particular</text>
  <text x="31" y="566" font-family="Georgia,serif" font-size="18" fill="#34332f">reason. The light fell differently there,</text>
  <text x="31" y="597" font-family="Georgia,serif" font-size="18" fill="#34332f">softer at the edges, and for once she</text>
  <text x="31" y="628" font-family="Georgia,serif" font-size="18" fill="#34332f">had nowhere else to be.</text>
  <text x="31" y="680" font-family="Georgia,serif" font-size="18" fill="#34332f">Near the station, John waved from</text>
  <text x="31" y="711" font-family="Georgia,serif" font-size="18" fill="#34332f">across the road. They spoke for a while,</text>
  <text x="31" y="742" font-family="Georgia,serif" font-size="18" fill="#34332f">the sort of conversation that gathers</text>
  <text x="31" y="773" font-family="Georgia,serif" font-size="18" fill="#34332f">its meaning slowly.</text>
  <rect x="31" y="791" width="284" height="30" rx="12" fill="#ebe9e1"/><text x="45" y="810" font-family="Menlo,monospace" font-size="9" fill="#68695e">✳  WRITTEN 24 OCTOBER · 3 MIN READ</text>
