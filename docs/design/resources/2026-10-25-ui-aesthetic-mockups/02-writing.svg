  <rect x="312" y="53" width="94" height="34" rx="17" fill="#1a1a18"/><text x="359" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#faf9f6">Save page</text>
  <line x1="0" y1="105" x2="430" y2="105" stroke="#e8e3db"/>
  <text x="27" y="143" font-family="Menlo,monospace" font-size="9" letter-spacing="1.1" fill="#817c73">JOURNAL / DRAFT</text>
  <circle cx="334" cy="140" r="3" fill="#aab49f"/><text x="343" y="143" font-family="Menlo,monospace" font-size="9" fill="#75766b">JUST FOR YOU</text>
  <text x="27" y="204" font-family="Georgia,serif" font-size="34" letter-spacing="-1.6" fill="#1a1a18">A walk around</text>
  <text x="27" y="241" font-family="Georgia,serif" font-size="34" letter-spacing="-1.6" fill="#1a1a18">the city</text>
  <text x="28" y="289" font-family="Georgia,serif" font-size="18" fill="#37352f">The air felt cooler this morning. I took</text>
  <text x="28" y="320" font-family="Georgia,serif" font-size="18" fill="#37352f">the longer way past the market and let</text>
  <text x="28" y="351" font-family="Georgia,serif" font-size="18" fill="#37352f">the day begin slowly.</text>
  <text x="28" y="403" font-family="Georgia,serif" font-size="18" fill="#37352f">I met</text><rect x="72" y="383" width="58" height="28" rx="7" fill="#e6eade"/><text x="79" y="403" font-family="Georgia,serif" font-size="18" fill="#37352f">John</text>
  <text x="136" y="403" font-family="Georgia,serif" font-size="18" fill="#37352f">near the station. We talked</text>
  <text x="28" y="434" font-family="Georgia,serif" font-size="18" fill="#37352f">about the little things first, then found</text>
  <text x="28" y="465" font-family="Georgia,serif" font-size="18" fill="#37352f">our way to what mattered.</text>
  <text x="28" y="517" font-family="Georgia,serif" font-size="18" fill="#37352f">By the time I got home, the light had</text>
  <text x="28" y="548" font-family="Georgia,serif" font-size="18" fill="#37352f">shifted. I felt more like myself again.</text>
  <rect x="23" y="601" width="384" height="112" rx="15" fill="#efede6" stroke="#e3dfd6"/>
  <circle cx="46" cy="629" r="12" fill="#e1e5da"/><text x="46" y="634" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#697361">✳</text>
  <text x="66" y="633" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#38372f">References noticed</text><text x="389" y="633" text-anchor="end" font-family="Menlo,monospace" font-size="9" letter-spacing=".3" fill="#697361">REVIEW</text>
  <rect x="38" y="651" width="104" height="24" rx="12" fill="#faf9f6" stroke="#dfdbd1"/><text x="90" y="667" text-anchor="middle" font-family="Menlo,monospace" font-size="8.5" fill="#68645c">John · PERSON</text>
  <rect x="150" y="651" width="108" height="24" rx="12" fill="#faf9f6" stroke="#dfdbd1"/><text x="204" y="667" text-anchor="middle" font-family="Menlo,monospace" font-size="8.5" fill="#68645c">station · PLACE</text>
  <rect x="266" y="651" width="122" height="24" rx="12" fill="#faf9f6" stroke="#dfdbd1"/><text x="327" y="667" text-anchor="middle" font-family="Menlo,monospace" font-size="8.5" fill="#68645c">morning · TIME</text>
  <text x="27" y="752" font-family="Georgia,serif" font-size="18" font-style="italic" fill="#8a857b">Continue writing…</text>
