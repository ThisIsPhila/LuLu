<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F2E9" />
    <title>LuLu — Current app preview</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color: #242421; background: #e9e5dc; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      button, a { font: inherit; }
      button:focus-visible, a:focus-visible { outline: 3px solid #75836f; outline-offset: 3px; }
      .preview { min-height: 100vh; padding: 24px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 20px; }
      .toolbar { max-width: 1440px; width: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
      .identity { display: flex; align-items: center; gap: 18px; }
      .identity img { width: 83px; height: auto; display: block; }
      .identity div { display: grid; gap: 4px; }
      .identity strong { font-size: 14px; }
      .identity small { color: #6d6b63; font-size: 12px; }
      .controls, .links { display: flex; align-items: center; gap: 8px; }
      .controls { padding: 4px; background: #f7f2e9; border-radius: 999px; }
      .controls button { border: 0; border-radius: 999px; padding: 9px 17px; background: transparent; cursor: pointer; color: #5e5e57; font-size: 13px; }
      .controls button[aria-pressed="true"] { background: #242421; color: #fff; }
      .links a { font-size: 12px; color: #44483d; text-decoration: none; border-bottom: 1px solid currentColor; padding: 4px 0; }
      .links a:hover { color: #000; }
      .stage { min-width: 0; display: flex; justify-content: center; align-items: start; }
      .frame { width: min(100%, 390px); height: min(844px, calc(100vh - 112px)); min-height: 600px; overflow: hidden; border-radius: 26px; box-shadow: 0 24px 70px #36302633; background: #f7f2e9; transition: width .25s ease, height .25s ease; }
      .frame[data-mode="desktop"] { width: min(100%, 1280px); height: min(820px, calc(100vh - 112px)); min-height: 600px; border-radius: 16px; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: #f7f2e9; }
      @media (max-width: 700px) { .preview { padding: 12px; gap: 12px; } .toolbar { align-items: start; } .identity { width: 100%; } .frame, .frame[data-mode="desktop"] { height: calc(100dvh - 145px); min-height: 520px; border-radius: 15px; } .frame[data-mode="desktop"] { min-width: 0; } }
      @media (prefers-reduced-motion: reduce) { .frame { transition: none; } }
    </style>
  </head>
  <body>
    <main class="preview">
      <header class="toolbar">
        <div class="identity">
          <img src="../public/media/brand/lulu-wordmark-black.png" alt="LuLu" />
          <div><strong>Current app preview</strong><small>Live view of the site at /</small></div>
        </div>
        <div class="controls" role="group" aria-label="Preview width">
          <button type="button" data-mode="mobile" aria-pressed="true">Mobile</button>
          <button type="button" data-mode="desktop" aria-pressed="false">Desktop</button>
        </div>
        <nav class="links" aria-label="Preview links">
          <a href="../" target="_blank" rel="noopener noreferrer">Open current site</a>
          <a href="./legacy.html">Old snapshot</a>
        </nav>
      </header>
      <section class="stage" aria-label="Current LuLu app in selected viewport">
        <div class="frame" id="frame" data-mode="mobile">
          <iframe src="../" title="Current LuLu app"></iframe>
        </div>
      </section>
    </main>
    <script>
      const frame = document.getElementById('frame');
      document.querySelectorAll('.controls [data-mode]').forEach((button) => {
        button.addEventListener('click', () => {
          frame.dataset.mode = button.dataset.mode;
          document.querySelectorAll('.controls [data-mode]').forEach((choice) => {
            choice.setAttribute('aria-pressed', String(choice === button));
          });
        });
      });
    </script>
  </body>
</html>
